[project]
name = "zepp-health"
version = "0.1.0"
description = "Zepp/Amazfit 健康数据分析，支持评分和风险预警"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
zepp-health = "zepp_health.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
